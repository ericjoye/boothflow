<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="BoothFlow — instant quotes, bookings, galleries, and follow-ups for photo booth rental operators.">
  <title>BoothFlow — Photo Booth Operator OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="app-header">
    <div class="logo">
      <span class="logo-icon">B</span>
      <span>BoothFlow</span>
    </div>
    <div id="app-nav-wrap"></div>
  </header>
  <div id="toast-container"></div>
  <main id="app-main"></main>
  <nav class="bottom-nav" id="app-bottom-nav">
    <button class="nav-item active" onclick="App.navigateTo('landing')">Home</button>
    <button class="nav-item" onclick="App.navigateTo('app')">App</button>
    <button class="nav-item" onclick="App.navigateTo('upgrade')">Upgrade</button>
  </nav>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/licensing.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
    window.addEventListener('DOMContentLoaded', function() { App.init(); });
  </script>
</body>
</html>
